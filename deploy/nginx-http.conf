server {
    listen 80;
    listen [::]:80;
    server_name art-supreme.com www.art-supreme.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    location ~ (^|/)\. { return 404; }
    location ~ ^/products/[^/]+/info\.json$ { return 404; }
    location / {
        root /srv/art-supreme/current/site;
        try_files $uri $uri/ =404;
    }
}
