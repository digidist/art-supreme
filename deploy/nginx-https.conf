server {
    listen 80;
    listen [::]:80;
    server_name art-supreme.com www.art-supreme.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }
    location / { return 301 https://art-supreme.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name art-supreme.com www.art-supreme.com;

    ssl_certificate /etc/letsencrypt/live/art-supreme.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/art-supreme.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    if ($host = www.art-supreme.com) { return 301 https://art-supreme.com$request_uri; }

    location ~ (^|/)\. { return 404; }
    location ~ ^/products/[^/]+/info\.json$ { return 404; }
    location / {
        root /srv/art-supreme/current/site;
        try_files $uri $uri/ =404;
    }
    location ~ ^/api/checkout(?:/|$) {
        proxy_pass http://127.0.0.1:3009;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_read_timeout 15s;
    }
}
